<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riftbound Collection</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <h1 class="brand">Riftbound<span>Collection</span></h1>

    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search name, text or keyword…" autocomplete="off">
      <kbd class="search-hint" aria-hidden="true">Ctrl F</kbd>
    </div>

    <button id="btn-menu" class="menu-btn" type="button" aria-expanded="false"
            aria-controls="topbar-panel" aria-label="Menu and filters">
      <span class="menu-icon" aria-hidden="true"></span>
      <span class="menu-badge" id="menu-badge" hidden></span>
    </button>
  </div>

  <!-- Everything past the search box collapses behind the burger on phones;
       on wider screens the wrapper is display:contents and lays out as before. -->
  <div class="topbar-panel" id="topbar-panel">
    <div class="topbar-actions">
      <button id="btn-pack" class="btn btn-pack" type="button">Open a pack</button>
      <button id="btn-deck" class="btn btn-primary" type="button">Build deck</button>
      <!-- Export opens a format menu: hover on a mouse, tap on a phone. The menu
           lives inside the wrapper so it can hang off the button on wide screens
           and unfold in the flow inside the burger panel on narrow ones. -->
      <div class="export-wrap" id="export-wrap">
        <button id="btn-export" class="btn" type="button" aria-haspopup="true"
                aria-expanded="false" aria-controls="export-menu">
          Export <span class="caret" aria-hidden="true">▾</span>
        </button>
        <div class="export-menu" id="export-menu" role="menu" aria-labelledby="btn-export">
          <button type="button" role="menuitem" data-format="json">
            <b>JSON</b><span>Full backup — imports back into this app</span>
          </button>
          <button type="button" role="menuitem" data-format="csv">
            <b>CSV</b><span>Spreadsheets and most collection trackers</span>
          </button>
          <button type="button" role="menuitem" data-format="rbgg">
            <b>riftbound.gg</b><span>Card ids their collection importer reads</span>
          </button>
          <button type="button" role="menuitem" data-format="txt">
            <b>Text</b><span>Readable list, grouped by set</span>
          </button>
          <button type="button" role="menuitem" data-format="tcg">
            <b>TCGplayer mass entry</b><span>Quantity and name, one card per line</span>
          </button>
        </div>
      </div>
      <button id="btn-import" class="btn" type="button">Import</button>
      <input id="file-import" type="file" accept="application/json" hidden>
      <!-- cloud.js removes this button when no Supabase project is configured. -->
      <button id="btn-account" class="btn btn-account" type="button"
              title="Sign in to sync your collection">Sign in</button>
    </div>

    <div class="statline" id="statline"></div>

    <div class="filters">
      <select id="f-set" class="sel"></select>
      <select id="f-domain" class="sel"></select>
      <select id="f-rarity" class="sel"></select>
      <select id="f-type" class="sel"></select>
      <select id="f-sort" class="sel sel-sort" aria-label="Sort order"></select>

      <div class="segmented" id="f-own" role="group" aria-label="Ownership filter">
        <button type="button" data-own="all" class="active">All</button>
        <button type="button" data-own="owned">Owned</button>
        <button type="button" data-own="missing">Missing</button>
        <button type="button" data-own="wishlist">Wishlist</button>
      </div>

      <label class="chk"><input type="checkbox" id="f-hide-promos" checked> Hide promos</label>

      <button id="btn-reset" class="btn btn-quiet" type="button">Reset</button>
    </div>
  </div>
</header>

<section id="stats-panel" class="stats-panel" hidden></section>

<main>
  <p id="result-count" class="result-count"></p>
  <div id="grid" class="grid"></div>
  <p id="empty" class="empty" hidden>No cards match these filters.</p>
</main>

<dialog id="deck-modal" class="deck-modal">
  <header class="deck-head">
    <div>
      <h2 class="deck-title">Suggested deck</h2>
      <p class="deck-sub" id="deck-sub"></p>
    </div>
    <div class="deck-head-actions">
      <select id="deck-legend" class="sel" aria-label="Build around a specific Legend"></select>
      <button id="deck-copy" class="btn" type="button">Copy list</button>
      <button id="deck-close" class="btn btn-quiet" type="button" aria-label="Close">✕</button>
    </div>
  </header>
  <div class="deck-body" id="deck-body"></div>
</dialog>

<!-- Card detail, opened by clicking any card image — in the grid or in a
     suggested deck. It can therefore be shown while the deck dialog is already
     open; both live in the top layer, and the one opened last is on top. -->
<dialog id="card-modal" class="card-modal">
  <div class="card-modal-body" id="card-modal-body"></div>
</dialog>

<!-- The pack simulator draws, shows and drops a pack; nothing it opens is saved,
     so it owns no state beyond the phase the stage is currently rendering. -->
<dialog id="pack-modal" class="pack-modal">
  <div class="pack-bar">
    <h2 class="pack-title" id="pack-title">Open a pack</h2>
    <div class="pack-bar-actions">
      <button id="pack-mute" class="icon-btn" type="button" aria-pressed="false"
              title="Mute pack sounds">🔊</button>
      <button id="pack-close" class="icon-btn" type="button" aria-label="Close">✕</button>
    </div>
  </div>
  <div class="pack-stage" id="pack-stage"></div>
</dialog>

<!-- Accounts are optional. The Supabase client itself is only fetched once
     there's a session to restore or someone actually opens this dialog. -->
<dialog id="auth-modal" class="auth-modal">
  <form id="auth-form" class="auth-form">
    <h2 id="auth-title">Sign in</h2>
    <p class="auth-sub" id="auth-sub">Welcome back — your collection is waiting.</p>

    <label class="auth-field">
      <span>Email</span>
      <input id="auth-email" type="email" autocomplete="email" required>
    </label>
    <label class="auth-field">
      <span>Password</span>
      <input id="auth-password" type="password" autocomplete="current-password"
             required minlength="6">
    </label>

    <p class="auth-error" id="auth-error" hidden></p>

    <div class="auth-actions">
      <button id="auth-submit" class="btn btn-primary" type="submit">Sign in</button>
      <button id="auth-cancel" class="btn btn-quiet" type="button">Cancel</button>
    </div>

    <p class="auth-switch">
      <span id="auth-switch-text">New here?</span>
      <button id="auth-switch" class="linkish" type="button">Create an account</button>
    </p>
  </form>

  <div class="auth-signed" id="auth-signed" hidden>
    <h2>Your account</h2>
    <p class="auth-sub" id="auth-who"></p>
    <p class="auth-note">Changes sync automatically. Signing out leaves this
      device's copy untouched.</p>
    <div class="auth-actions">
      <button id="auth-signout" class="btn" type="button">Sign out</button>
      <button id="auth-done" class="btn btn-quiet" type="button">Done</button>
    </div>
  </div>
</dialog>

<div id="toast" class="toast" hidden></div>

<script src="data/cards.js"></script>
<script src="data/prices.js"></script>
<script src="deck.js"></script>
<script src="pack.js"></script>
<script src="app.js"></script>
<script src="supabase-config.js"></script>
<script src="cloud.js"></script>
</body>
</html>
